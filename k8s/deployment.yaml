apiVersion: apps/v1
kind: Deployment
metadata:
  name: expert-api-deployment
  namespace: production
  labels:
    app.kubernetes.io/name: expert-api
    app.kubernetes.io/part-of: expert-publishing-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: expert-api
  template:
    metadata:
      labels:
        app: expert-api
    spec:
      containers:
        - name: expert-api
          image: registry.journal.domain/expert-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          envFrom:
            - configMapRef:
                name: expert-api-config
            - secretRef:
                name: expert-api-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: expert-api-service
  namespace: production
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 4000
      protocol: TCP
  selector:
    app: expert-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: expert-api-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: expert-api-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
