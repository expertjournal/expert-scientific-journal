version: '3.8'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: expert_api_prod
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://expert_user:secure_db_pass@postgres:5432/expert_journal_db?schema=public&connection_limit=25
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=prod_super_secret_jwt_key_expert_2026_base64_hash
      - FRONTEND_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: expert_postgres_db
    restart: always
    environment:
      POSTGRES_USER: expert_user
      POSTGRES_PASSWORD: secure_db_pass
      POSTGRES_DB: expert_journal_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expert_user -d expert_journal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: expert_redis_cache
    restart: always
    command: redis-server --appendonly yes --requirepass redis_secure_password
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
